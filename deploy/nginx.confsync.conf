# nginx vhost for confsync.tool.chenzhaoyun.com
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then run: sudo certbot --nginx -d confsync.tool.chenzhaoyun.com
# (certbot rewrites this to add the 443/SSL blocks automatically)

server {
    server_name confsync.tool.chenzhaoyun.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8930;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/confsync.access.log;
    error_log  /var/log/nginx/confsync.error.log;

    listen 80;
    listen [::]:80;
}
