[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confsync-server"
dynamic = ["version"]
description = "confsync server — encrypted config document store with GitHub OAuth and Web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
confsync-server = "confsync_server.cli:main"

[tool.hatch.version]
path = "confsync_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["confsync_server"]
