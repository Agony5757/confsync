[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confsync-client"
dynamic = ["version"]
description = "Client library and CLI for confsync — pull/push encrypted config documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
confsync = "confsync.cli:main"

[tool.hatch.version]
path = "confsync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["confsync"]
